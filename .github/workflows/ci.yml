name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Serialized everywhere. The REPL tests spawn the binary as a subprocess and
  # several tests share fixtures under tests/data/, so running them in parallel
  # made macOS and Windows flaky in a way Linux never showed.
  RUST_TEST_THREADS: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Per OS, not just Linux: src/tsq.rs and src/storage/mmap.rs have
      # cfg(unix) branches whose non-unix side is otherwise never linted.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # Run even when Clippy failed, so a lint (often a new one from a stable
      # toolchain release) does not hide the test results on every OS.
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked

  test-release:
    name: Test (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --release

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Read from the rust-version declared in Cargo.toml. That field claimed
      # 1.70 for a long time while the dependency tree had moved well past it,
      # because nothing ever checked. Not pinned as @1.88: Dependabot would
      # propose bumping that ref to toolchains that do not exist yet.
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Library and binaries only: rust-version is a promise to consumers, and
      # dev-dependencies are not part of it.
      - name: Check build at MSRV
        run: cargo check --locked
