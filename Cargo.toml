[package]
name = "sqawk"
version = "0.8.2"
edition = "2021"
authors = ["Jeff Garzik <jgarzik@pobox.com>"]
description = "An SQL-based command-line tool for processing delimiter-separated files (CSV, TSV, etc.), inspired by awk"
license = "MIT"
repository = "https://github.com/jgarzik/sqawk"
homepage = "https://github.com/jgarzik/sqawk"
readme = "README.md"
keywords = ["csv", "tsv", "sql", "delimited", "awk"]
categories = ["command-line-utilities", "text-processing", "parser-implementations"]
# Minimum supported Rust version.
#
# Verified by building with that toolchain, not inferred. The binding
# constraints are transitive: `home` (via rustyline) and `psm` (via
# sqlparser -> recursive -> stacker) both require 1.88.
rust-version = "1.88"
# `doc/` is deliberately NOT excluded: README.md links into it, and shipping it
# keeps those links resolvable in a vendored or offline copy of the crate.
exclude = [
    "tests/",
    ".github/",
    "CLAUDE.md",
    "generated-icon.png",
    ".replit",
    ".sqawk_history",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
sqlparser = "0.62"
csv = "1"
anyhow = "1"
regex = "1"
tempfile = "3"

rustyline = "15"
# Runs sqawk on a large stack (see MAIN_STACK_BYTES in main.rs); already in
# the build through sqlparser -> recursive.
stacker = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true

[profile.profiling]
inherits = "release"
debug = true

[[bin]]
name = "sqawk"
path = "src/main.rs"

# `tsq`, the test-data generator, is a separate workspace member with
# `publish = false`: it builds and runs locally (`cargo run -p tsq`) but is
# not part of the published sqawk crate. `cargo package` skips nested crates.
# Only sqawk is a default member, so plain `cargo build` / `cargo publish`
# act on sqawk alone; use `--workspace` (as CI does) to include tsq.
[workspace]
members = ["tsq"]
default-members = ["."]
